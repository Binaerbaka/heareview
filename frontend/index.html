<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta
        name="viewport"
        content="width=device-width, initial-scale=1.0"
    >
    <title>HearReview</title>
    <link rel="stylesheet" href="style.css">
</head>

<body>
    <header class="topbar">
        <div>
            <h1>HearReview</h1>
            <p>Real-time Lecture Assistant</p>
        </div>

        <div id="server-status" class="status offline">
            服务器未连接
        </div>
    </header>

    <main id="app-layout" class="layout">
        <section class="caption-panel">
            <div class="panel-header">
                <div>
                    <h2>课堂字幕</h2>
                    <input
                        id="course-name"
                        type="text"
                        placeholder="课程名称，例如 EE Lecture"
                        value="Untitled Lecture"
                    >
                    <p id="session-time">00:00:00</p>
                </div>

                <div class="controls">
                    <button id="start-button">
                        开始课堂
                    </button>

                    <button id="stop-button" disabled>
                        结束课堂
                    </button>

                    <button id="download-markdown-button" disabled>
                        下载字幕
                    </button>

                    <button id="download-json-button" disabled>
                        下载JSON
                    </button>
                </div>
            </div>

            <!-- 已确认字幕会持续向下显示。 -->
            <div id="confirmed-captions" class="confirmed-captions">
                <div class="empty-message">
                    点击“开始课堂”后，实时字幕将显示在这里。
                </div>
            </div>

            <!-- 临时字幕允许随模型输出不断变化。 -->
            <div class="partial-container">
                <span class="partial-label">正在识别</span>
                <p id="partial-caption">等待语音……</p>
                <p id="partial-translation-caption" class="partial-translation" hidden></p>
            </div>

            <!-- 拖动可调整总结面板高度（v0.6.2）。 -->
            <div
                id="summary-resizer"
                class="resize-handle resize-horizontal"
                role="separator"
                aria-label="调整总结高度"
            ></div>

            <!-- 实时课堂要点：基于已确认字幕生成。 -->
            <section class="summary-panel" id="summary-panel">
                <div class="summary-heading">
                    <div>
                        <h3>实时课堂要点</h3>
                        <p class="summary-hint">基于已确认字幕生成，不影响实时转录。</p>
                    </div>

                    <span id="summary-state" class="summary-state is-idle">尚未配置</span>
                </div>

                <div id="summary-content" class="summary-content">
                    <p class="summary-placeholder">连接 LLM 后，这里会持续显示本阶段重点。</p>
                </div>

                <div class="summary-actions">
                    <button id="summary-now-button" type="button">生成当前总结</button>
                </div>
            </section>
        </section>

        <!-- 拖动可调整设置栏宽度（v0.6.2）。 -->
        <div
            id="sidebar-resizer"
            class="resize-handle resize-vertical"
            role="separator"
            aria-label="调整设置栏宽度"
        ></div>

        <aside class="information-panel">
            <section class="info-card">
                <h3>课堂设置</h3>

                <label for="microphone-select">输入设备</label>

                <div class="device-row">
                    <select id="microphone-select">
                        <option value="">系统默认麦克风</option>
                    </select>

                    <button id="refresh-devices-button" type="button">
                        刷新
                    </button>
                </div>

                <div class="volume-row">
                    <span>音量</span>

                    <div class="volume-track">
                        <div id="volume-level" class="volume-level"></div>
                    </div>

                    <span id="volume-status">未检测</span>
                </div>
            </section>

            <section class="info-card">
                <h3>翻译</h3>

                <div class="translation-control">
                    <button
                        id="translation-toggle"
                        class="translation-toggle"
                        type="button"
                        aria-pressed="false"
                        title="翻译已关闭"
                    >
                        <span class="toggle-square" aria-hidden="true"></span>
                        翻译
                    </button>

                    <select id="translation-direction" aria-label="翻译方向">
                        <option value="en-zh">EN → 中</option>
                        <option value="zh-en">中 → EN</option>
                    </select>
                </div>

                <p id="translation-state" class="translation-state">翻译关闭</p>
            </section>

            <section class="info-card">
                <div class="summary-heading">
                    <h3>LLM 设置</h3>
                    <button id="summary-settings-button" class="subtle-button" type="button">展开</button>
                </div>

                <form id="summary-settings" class="summary-settings" hidden>
                    <label>服务提供商
                        <select id="summary-provider">
                            <option value="ollama">Ollama（本机、免费）</option>
                            <option value="deepseek">DeepSeek API</option>
                            <option value="openai-compatible">OpenAI-compatible API</option>
                        </select>
                    </label>

                    <label>模型
                        <input id="summary-model" required autocomplete="off">
                    </label>

                    <label id="summary-endpoint-row">接口地址
                        <input id="summary-endpoint" placeholder="留空使用服务默认地址" autocomplete="url">
                    </label>

                    <label id="summary-key-row">API Key
                        <input id="summary-api-key" type="password" placeholder="仅保留在当前页面，不会写入本机存储" autocomplete="off">
                    </label>

                    <p id="summary-provider-note" class="summary-provider-note"></p>

                    <div class="summary-settings-actions">
                        <button type="submit">保存并测试</button>
                        <button id="summary-close-settings" class="subtle-button" type="button">关闭</button>
                    </div>
                </form>
            </section>

            <section class="info-card">
                <h3>处理状态</h3>

                <div class="metric">
                    <span>转录积压</span>
                    <strong id="transcription-lag">0.0s</strong>
                </div>

                <div class="metric">
                    <span>确认策略积压</span>
                    <strong id="policy-lag">0.0s</strong>
                </div>

                <div class="metric">
                    <span>模型处理积压</span>
                    <strong id="processing-lag">0.0s</strong>
                </div>
            </section>

            <section class="info-card">
                <h3>当前版本</h3>
                <p>HearReview v0.6.3</p>
                <p>WhisperLiveKit + SimulStreaming</p>
            </section>
        </aside>
    </main>

    <script src="app.js"></script>
</body>
</html>
